# DATABASE CONFIG
spring.datasource.url=jdbc:postgresql://localhost:5432/whatsapp_responses
spring.datasource.username=postgres
spring.datasource.password=godisgr8

# DRIVER (optional but safer)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA CONFIG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON dates always as ISO-8601 UTC (e.g. 2026-09-02T12:42:12.665Z)
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Also set -Duser.timezone=UTC (and WebhookApplication TimeZone.setDefault) so
# LocalDateTime.now(UTC) is not shifted by an IST JVM on persist.